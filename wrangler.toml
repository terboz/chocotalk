name = "chocotalk"
main = "src/worker.js"
compatibility_date = "2026-11-01"

[vars]
# Web Push (VAPID) の連絡先。https:// の URL か mailto: のアドレス
VAPID_SUBJECT = "https://chocotalk.terboz.workers.dev"
# 秘密鍵 VAPID_PRIVATE_JWK は Secret で設定する（README「Web Push の設定」参照）

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Directory"]
